name: Knowledge textbook checks and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Require installed browser
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser" && test -x "$browser"
          echo "HM_EDGE_PATH=$browser" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm test
      - run: npm run evaluate
      - name: Verify repository-prefixed navigation
        run: node --test tests/reader-browser.test.mjs tests/interactive-browser.test.mjs tests/reading-journey-browser.test.mjs tests/evidence-path-browser.test.mjs
        env:
          HM_PILOT_BASE_PATH: /HybridMind-
      - run: npm run build:pages
        env:
          HM_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run test:pages
      - name: Stage authorized main deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: knowledge-textbook-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to existing Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
