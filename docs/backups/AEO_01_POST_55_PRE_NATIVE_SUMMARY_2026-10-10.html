        &lt;h1 id=&quot;hero-title&quot;&gt;จากคนใช้ AI&lt;br&gt;สู่ &lt;span class=&quot;gradient&quot;&gt;AI ที่ไปทำงาน&lt;br&gt;แทนคน&lt;/span&gt;&lt;/h1&gt;
        &lt;p class=&quot;hero-lede&quot;&gt;เราคุ้นเคยกับการสั่ง AI ให้ตอบคำถามหรือช่วยสร้าง Agent แต่ตอนนี้ AI สามารถใช้เครื่องมือ เข้าเว็บไซต์ และประสานงานกับ AI ตัวอื่นได้ในระบบที่รองรับ&lt;/p&gt;
        &lt;div class=&quot;hero-quote&quot;&gt;ทักษะใหม่ไม่ใช่แค่ “สร้าง Agent ให้เก่ง” แต่คือ “มอบหมายงานให้ AI ไปใช้บริการต่าง ๆ อย่างถูกต้อง”&lt;/div&gt;
        &lt;div class=&quot;hero-actions&quot;&gt;&lt;a class=&quot;cta&quot; href=&quot;#shift&quot;&gt;เริ่มเรียนรู้ &lt;span aria-hidden=&quot;true&quot;&gt;↘&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;ghost&quot; href=&quot;#quiz&quot;&gt;ทดสอบความเข้าใจ&lt;/a&gt;&lt;/div&gt;
        &lt;div class=&quot;meta&quot;&gt;&lt;span&gt;◷ ใช้เวลาประมาณ 10–12 นาที&lt;/span&gt;&lt;span&gt;◈ เหมาะกับคนทั่วไปและผู้เริ่มใช้ AI&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hero-illustration&quot; role=&quot;img&quot; aria-label=&quot;ภาพแนวคิด คนสั่ง AI หนึ่งตัว และ AI เชื่อมต่อเครื่องมือ หน้าจอคอมพิวเตอร์ และ AI ตัวอื่น&quot;&gt;
        &lt;div class=&quot;radial&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;visual-board&quot;&gt;
          &lt;div class=&quot;windowhead&quot;&gt;&lt;span&gt;ONE GOAL → MANY CAPABILITIES&lt;/span&gt;&lt;span class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;command&quot;&gt;&lt;span class=&quot;avatar&quot;&gt;👤&lt;/span&gt;&lt;span&gt;“ช่วยทำงานนี้ให้เสร็จ ตรวจผล และให้ฉันอนุมัติก่อนดำเนินการสำคัญ”&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;downpath&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;brain&quot;&gt;&lt;div class=&quot;brain-logo&quot;&gt;✳&lt;/div&gt;&lt;div&gt;&lt;strong&gt;AI ผู้ช่วยหลัก&lt;/strong&gt;&lt;br&gt;&lt;span&gt;เข้าใจเป้าหมาย · เลือกวิธีลงมือทำ · ติดตามผล&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;three-heads&quot;&gt;
            &lt;div class=&quot;mini a&quot;&gt;&lt;span class=&quot;symbol&quot;&gt;⚙&lt;/span&gt;&lt;strong&gt;TOOLS&lt;/strong&gt;&lt;span&gt;API / MCP&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;mini b&quot;&gt;&lt;span class=&quot;symbol&quot;&gt;▣&lt;/span&gt;&lt;strong&gt;COMPUTER&lt;/strong&gt;&lt;span&gt;ใช้เว็บ / โปรแกรม&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;mini c&quot;&gt;&lt;span class=&quot;symbol&quot;&gt;⇄&lt;/span&gt;&lt;strong&gt;AGENTS&lt;/strong&gt;&lt;span&gt;A2A Protocol&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;shift&quot; aria-labelledby=&quot;shift-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;01 / THE SHIFT&lt;/p&gt;
      &lt;h2 id=&quot;shift-heading&quot;&gt;สิ่งที่เปลี่ยน ไม่ใช่แค่ AI ฉลาดขึ้น&lt;br&gt;แต่คือ &lt;span style=&quot;color:var(--mint)&quot;&gt;AI ลงมือทำงานได้มากขึ้น&lt;/span&gt;&lt;/h2&gt;
      &lt;p class=&quot;section-lede&quot;&gt;ให้มองเป็นการขยายความสามารถ ไม่ใช่ขั้นบันไดที่ทิ้งของเก่า เพราะ Agent, Harness, Tool Use และ A2A สามารถทำงานร่วมกันในระบบเดียวกันได้&lt;/p&gt;
      &lt;div class=&quot;part-grid&quot;&gt;
        &lt;article class=&quot;part&quot; style=&quot;--tone:var(--blue)&quot;&gt;&lt;div class=&quot;step&quot;&gt;มุมมองเดิม&lt;/div&gt;&lt;div class=&quot;pico&quot;&gt;💬&lt;/div&gt;&lt;h3&gt;AI เป็นผู้ตอบ&lt;/h3&gt;&lt;p&gt;มนุษย์ถาม AI ช่วยคิด เขียนโค้ด ทำแผน หรือให้คำแนะนำ แล้วมนุษย์เป็นคนไปเปิดเว็บและทำงานต่อเอง&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;part&quot; style=&quot;--tone:var(--peach)&quot;&gt;&lt;div class=&quot;step&quot;&gt;มุมมองที่พัฒนาขึ้น&lt;/div&gt;&lt;div class=&quot;pico&quot;&gt;🧩&lt;/div&gt;&lt;h3&gt;Agent ใน Harness&lt;/h3&gt;&lt;p&gt;เราออกแบบระบบให้ Agent มีแผน เครื่องมือ หน่วยความจำ กฎ และขั้นตอนตรวจสอบ เพื่อทำงานซับซ้อนได้สม่ำเสมอ&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;part&quot; style=&quot;--tone:var(--mint)&quot;&gt;&lt;div class=&quot;step&quot;&gt;มุมมองที่ต้องเรียนรู้เพิ่ม&lt;/div&gt;&lt;div class=&quot;pico&quot;&gt;⇄&lt;/div&gt;&lt;h3&gt;AI ใช้ระบบภายนอก&lt;/h3&gt;&lt;p&gt;เรากำหนดเป้าหมายและสิทธิ์ให้ AI ไปใช้ซอฟต์แวร์ บริการ และประสาน Agent อื่นเพื่อทำงานหลายระบบให้สำเร็จ&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
      &lt;div class=&quot;quote-rail&quot;&gt;“จากการสั่ง AI ให้ &lt;em&gt;สร้างคำตอบ&lt;/em&gt; → สู่การสั่ง AI ให้ &lt;em&gt;ทำงานจนได้ผลลัพธ์ที่ตรวจสอบได้&lt;/em&gt;”&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;concepts&quot; aria-labelledby=&quot;concept-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;02 / THE VOCABULARY&lt;/p&gt;
      &lt;h2 id=&quot;concept-heading&quot;&gt;5 คำที่ต้องแยกให้ออก&lt;/h2&gt;
      &lt;p class=&quot;section-lede&quot;&gt;คำศัพท์เหล่านี้ไม่ใช่สิ่งเดียวกัน โดยเฉพาะ &lt;strong style=&quot;color:#f2faf9&quot;&gt;A2A ไม่ได้หมายถึง AI กดเว็บไซต์&lt;/strong&gt; แต่หมายถึง Agent ติดต่อกับ Agent อื่น&lt;/p&gt;
      &lt;div class=&quot;legend-grid&quot;&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;strong&gt;① Agent — ผู้ปฏิบัติงาน&lt;/strong&gt;&lt;p&gt;ระบบ AI ที่รับเป้าหมาย วางแผน เลือกการกระทำ และตรวจผลงาน&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;strong&gt;② Harness — ระบบควบคุมงาน&lt;/strong&gt;&lt;p&gt;โครงที่จัดการลำดับงาน เครื่องมือ สิทธิ์ ความจำ ความผิดพลาด และการตรวจสอบของ Agent&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;strong&gt;③ Tool Use / Computer Use&lt;/strong&gt;&lt;p&gt;การเรียก API หรือควบคุมเมาส์ คีย์บอร์ด และหน้าเว็บไซต์/โปรแกรมแบบที่มนุษย์ใช้&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;strong&gt;④ MCP — Agent ↔ Tool&lt;/strong&gt;&lt;p&gt;มาตรฐานหนึ่งที่ช่วยให้ AI ติดต่อเครื่องมือ ข้อมูล และทรัพยากรจากภายนอกด้วยโครงสร้างที่กำหนดไว้&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;legend-item&quot; style=&quot;grid-column:1/-1;border-color:rgba(112,239,206,.4)&quot;&gt;&lt;strong style=&quot;color:var(--mint)&quot;&gt;⑤ A2A — Agent ↔ Agent &lt;span class=&quot;badge&quot;&gt;FOCUS&lt;/span&gt;&lt;/strong&gt;&lt;p&gt;มาตรฐานสื่อสารระหว่าง Agent ที่อาจสร้างโดยคนละองค์กรหรือแพลตฟอร์ม เพื่อค้นหาความสามารถ มอบหมายงาน แลกเปลี่ยนสถานะ และรับผลลัพธ์&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;map&quot; aria-labelledby=&quot;map-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;03 / INTERACTIVE MAP&lt;/p&gt;
      &lt;h2 id=&quot;map-heading&quot;&gt;AI ออกไปทำงานได้ &lt;span style=&quot;color:var(--mint)&quot;&gt;3 เส้นทาง&lt;/span&gt;&lt;/h2&gt;
      &lt;p class=&quot;section-lede&quot;&gt;ลองกดแต่ละเส้นทาง ระบบจะแสดงความแตกต่างระหว่างเรียกเครื่องมือ ควบคุมหน้าจอ และทำงานร่วมกับ Agent ตัวอื่น&lt;/p&gt;
      &lt;div class=&quot;showcase&quot;&gt;
        &lt;div class=&quot;selector-row&quot; role=&quot;group&quot; aria-label=&quot;เลือกเส้นทางที่ AI ใช้&quot;&gt;
          &lt;button class=&quot;select-btn&quot; type=&quot;button&quot; data-path=&quot;tool&quot; aria-pressed=&quot;true&quot;&gt;⚙ เรียกเครื่องมือ&lt;/button&gt;
          &lt;button class=&quot;select-btn&quot; type=&quot;button&quot; data-path=&quot;gui&quot; aria-pressed=&quot;false&quot;&gt;▣ ใช้คอมพิวเตอร์&lt;/button&gt;
          &lt;button class=&quot;select-btn&quot; type=&quot;button&quot; data-path=&quot;a2a&quot; aria-pressed=&quot;false&quot;&gt;⇄ ติดต่อ Agent&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;architecture&quot; aria-label=&quot;แผนภาพการไหลงานของ AI&quot;&gt;
          &lt;div class=&quot;arch-node human&quot;&gt;&lt;strong&gt;👤 มนุษย์&lt;/strong&gt;&lt;small&gt;กำหนดเป้าหมาย ข้อจำกัด และสิทธิ์&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;link-vertical&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;arch-node master&quot;&gt;&lt;strong&gt;✳ AI ผู้ช่วยหลัก&lt;/strong&gt;&lt;small&gt;ทำงานภายใต้ Harness และตรวจสถานะ&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;arch-lanes&quot;&gt;
            &lt;div class=&quot;lane on&quot; data-lane=&quot;tool&quot; style=&quot;--tone:var(--mint)&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;⚙&lt;/div&gt;&lt;div class=&quot;name&quot;&gt;Tool / MCP&lt;/div&gt;&lt;div class=&quot;subtitle&quot;&gt;ใช้ข้อมูลหรือฟังก์ชันที่เชื่อมต่อไว้&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;AGENT → TOOL&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;lane&quot; data-lane=&quot;gui&quot; style=&quot;--tone:var(--blue)&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;▣&lt;/div&gt;&lt;div class=&quot;name&quot;&gt;Computer Use&lt;/div&gt;&lt;div class=&quot;subtitle&quot;&gt;เปิดเว็บ คลิก พิมพ์ กรอกฟอร์ม&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;AGENT → UI&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;lane&quot; data-lane=&quot;a2a&quot; style=&quot;--tone:var(--purple)&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;⇄&lt;/div&gt;&lt;div class=&quot;name&quot;&gt;A2A Protocol&lt;/div&gt;&lt;div class=&quot;subtitle&quot;&gt;มอบหมายงานให้ Agent ต่างระบบ&lt;/div&gt;&lt;div class=&quot;tag&quot;&gt;AGENT → AGENT&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;path-info&quot; aria-live=&quot;polite&quot;&gt;&lt;div&gt;&lt;strong id=&quot;pathTitle&quot;&gt;เส้นทาง: เรียกเครื่องมือผ่าน API / MCP&lt;/strong&gt;&lt;p id=&quot;pathDesc&quot;&gt;AI ใช้ความสามารถของบริการอื่นโดยตรง ไม่จำเป็นต้องมี Agent อีกตัวรอรับงาน&lt;/p&gt;&lt;/div&gt;&lt;ol id=&quot;pathSteps&quot;&gt;&lt;li&gt;ตรวจว่ามีสิทธิ์ใช้เครื่องมือ&lt;/li&gt;&lt;li&gt;เรียกใช้ฟังก์ชันที่ตรงกับงาน&lt;/li&gt;&lt;li&gt;อ่านผลและตรวจสอบ&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;fine&quot; style=&quot;margin:17px 3px 0&quot;&gt;หมายเหตุ: MCP เป็นหนึ่งในมาตรฐานสำหรับเชื่อมต่อเครื่องมือ ไม่ใช่เครื่องมือทุกชนิดต้องใช้ MCP และระบบหลาย Agent ไม่จำเป็นต้องใช้โปรโตคอล A2A เสมอไป&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;demo&quot; aria-labelledby=&quot;demo-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;04 / ONE TASK, THREE WAYS&lt;/p&gt;
      &lt;h2 id=&quot;demo-heading&quot;&gt;งานเดียวกัน แต่รูปแบบการทำงานเปลี่ยนไป&lt;/h2&gt;
      &lt;p class=&quot;section-lede&quot;&gt;ตัวอย่างการเลือกซื้อสินค้า: ไม่ได้เปรียบเทียบว่าแบบใดเก่งกว่าเสมอ แต่เพื่อให้เห็นว่าคนต้องลงมือเองแค่ไหน และ AI ติดต่อกับระบบอะไร&lt;/p&gt;
      &lt;div class=&quot;showcase&quot;&gt;
        &lt;div class=&quot;case-head&quot;&gt;&lt;div class=&quot;selector-row&quot; role=&quot;group&quot; aria-label=&quot;เปลี่ยนรูปแบบการทำงาน&quot;&gt;&lt;button class=&quot;select-btn&quot; data-case=&quot;manual&quot; aria-pressed=&quot;true&quot;&gt;คนทำเอง&lt;/button&gt;&lt;button class=&quot;select-btn&quot; data-case=&quot;tools&quot; aria-pressed=&quot;false&quot;&gt;Agent ใช้ Tools / UI&lt;/button&gt;&lt;button class=&quot;select-btn&quot; data-case=&quot;a2a&quot; aria-pressed=&quot;false&quot;&gt;Agent คุย Agent&lt;/button&gt;&lt;/div&gt;&lt;span class=&quot;badge&quot; id=&quot;caseBadge&quot;&gt;WORKFLOW&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;scenario-card&quot;&gt;&lt;div class=&quot;scenario-icon&quot;&gt;🛍&lt;/div&gt;&lt;div&gt;&lt;strong&gt;โจทย์จากมนุษย์&lt;/strong&gt;&lt;p&gt;“หาอุปกรณ์สำหรับทำงานกับ AI ราคาไม่เกิน 2,000 บาท เปรียบเทียบตัวเลือกและให้ฉันอนุมัติก่อนซื้อ”&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;case-steps&quot; id=&quot;caseSteps&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;case-note&quot; id=&quot;caseNote&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;practice&quot; aria-labelledby=&quot;practice-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;05 / PRACTICAL EXERCISE&lt;/p&gt;
      &lt;h2 id=&quot;practice-heading&quot;&gt;ฝึกเปลี่ยนจาก “ถาม AI” เป็น “มอบหมายงาน AI”&lt;/h2&gt;
      &lt;p class=&quot;section-lede&quot;&gt;เลือกตัวอย่างแล้วนำคำสั่งไปใช้กับ AI ที่มีเครื่องมือและสิทธิ์ที่เหมาะสม เป้าหมายคือได้ผลจริง มีหลักฐานตรวจสอบ และให้ผู้ใช้ยืนยันก่อนทำสิ่งที่มีผลกระทบ&lt;/p&gt;
      &lt;div class=&quot;section-two&quot;&gt;
        &lt;div class=&quot;instruction-card&quot;&gt;&lt;p class=&quot;field-title&quot;&gt;เลือกรูปแบบงาน&lt;/p&gt;&lt;div class=&quot;selector-row&quot; role=&quot;group&quot; aria-label=&quot;เลือกตัวอย่างคำสั่ง AI&quot;&gt;&lt;button class=&quot;select-btn&quot; data-prompt=&quot;shop&quot; aria-pressed=&quot;true&quot;&gt;🛍 ช้อปปิ้ง&lt;/button&gt;&lt;button class=&quot;select-btn&quot; data-prompt=&quot;content&quot; aria-pressed=&quot;false&quot;&gt;◈ เผยแพร่คอนเทนต์&lt;/button&gt;&lt;button class=&quot;select-btn&quot; data-prompt=&quot;message&quot; aria-pressed=&quot;false&quot;&gt;✉ ส่งข้อความ&lt;/button&gt;&lt;/div&gt;&lt;h3 style=&quot;margin-top:25px&quot;&gt;คำสั่งมอบหมายงานที่ดีมี 4 ส่วน&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;เป้าหมายและผลลัพธ์ที่ต้องการ&lt;/li&gt;&lt;li&gt;เครื่องมือหรือระบบที่อนุญาตให้เข้าถึง&lt;/li&gt;&lt;li&gt;ข้อจำกัดและวิธีตรวจผล&lt;/li&gt;&lt;li&gt;จุดที่ต้องขออนุมัติก่อนลงมือ&lt;/li&gt;&lt;/ul&gt;&lt;p style=&quot;margin-bottom:0&quot;&gt;AI ไม่ได้ใช้ได้ทุกเว็บหรือทุกบัญชีอัตโนมัติ ต้องมีการเชื่อมต่อ สิทธิ์ และการรองรับจริง&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;prompt-pane&quot;&gt;&lt;div class=&quot;prompt-label&quot;&gt;PROMPT TO ACTION&lt;/div&gt;&lt;div id=&quot;promptText&quot; role=&quot;region&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;button-row&quot;&gt;&lt;span id=&quot;copyStatus&quot;&gt;กดคัดลอกเพื่อนำไปทดลอง&lt;/span&gt;&lt;button type=&quot;button&quot; id=&quot;copyBtn&quot; class=&quot;cta&quot;&gt;คัดลอกคำสั่ง ↗&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mini-safety&quot;&gt;&lt;strong&gt;หลักความปลอดภัย:&lt;/strong&gt; ก่อนสั่งซื้อ ส่งข้อความ เผยแพร่ข้อมูลสู่สาธารณะ หรือแก้ไขข้อมูลสำคัญ ควรกำหนดขอบเขตสิทธิ์ ตรวจตัวตนผู้รับ และให้มนุษย์อนุมัติขั้นตอนสุดท้าย&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;quiz&quot; aria-labelledby=&quot;quiz-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;06 / CHECK YOUR UNDERSTANDING&lt;/p&gt;
      &lt;h2 id=&quot;quiz-heading&quot;&gt;คุณแยก A2A ออกจาก Tool Use ได้หรือยัง?&lt;/h2&gt;
      &lt;p class=&quot;section-lede&quot;&gt;ตอบ 3 คำถามสั้น ๆ เพื่อจับหลักให้แม่น ไม่ใช่ทุกครั้งที่ AI ใช้ระบบภายนอกจะนับเป็น A2A&lt;/p&gt;
      &lt;div class=&quot;quiz-shell&quot;&gt;&lt;div id=&quot;quizBody&quot;&gt;&lt;div class=&quot;quiz-line&quot;&gt;&lt;span id=&quot;quizProgress&quot;&gt;คำถาม 1 จาก 3&lt;/span&gt;&lt;span&gt;เลือกคำตอบที่ตรงที่สุด&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;progress&quot; aria-hidden=&quot;true&quot;&gt;&lt;span id=&quot;progressBar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;h3 id=&quot;question&quot;&gt;&lt;/h3&gt;&lt;div class=&quot;answers&quot; id=&quot;answers&quot;&gt;&lt;/div&gt;&lt;div class=&quot;quiz-feedback&quot; id=&quot;feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;quiz-foot&quot;&gt;&lt;span class=&quot;fine&quot;&gt;ฝึกแยกจากลักษณะการเชื่อมต่อ ไม่ใช่ชื่อผลิตภัณฑ์&lt;/span&gt;&lt;button id=&quot;nextQuestion&quot; type=&quot;button&quot; class=&quot;ghost&quot; disabled&gt;ข้อต่อไป →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;quiz-result&quot; id=&quot;quizResult&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;LESSON COMPLETE&lt;/div&gt;&lt;div class=&quot;score&quot; id=&quot;finalScore&quot;&gt;3/3&lt;/div&gt;&lt;h3 style=&quot;margin:0&quot;&gt;คุณเริ่มมองเห็นสถาปัตยกรรมเบื้องหลังแล้ว&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:14px&quot;&gt;จำให้ขึ้นใจ: Agent มี Harness ได้ ใช้ Tools ได้ ควบคุมคอมพิวเตอร์ได้ และอาจสื่อสารกับ Agent อื่นผ่าน A2A ได้&lt;/p&gt;&lt;button class=&quot;ghost&quot; type=&quot;button&quot; id=&quot;restartQuiz&quot;&gt;ทำแบบทดสอบอีกครั้ง&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;takeaway&quot; aria-labelledby=&quot;takeaway-heading&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;p class=&quot;kicker&quot;&gt;07 / THE NEW SKILL&lt;/p&gt;
      &lt;h2 id=&quot;takeaway-heading&quot;&gt;สอนคนให้ &lt;span style=&quot;color:var(--mint)&quot;&gt;มอบหมายงานเป็น&lt;/span&gt; ไม่ใช่แค่ Prompt เป็น&lt;/h2&gt;
      &lt;div class=&quot;do-dont&quot;&gt;&lt;div&gt;&lt;h3 style=&quot;color:var(--peach)&quot;&gt;อย่าสอนแค่...&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;เขียน Prompt ให้คำตอบยาวขึ้น&lt;/li&gt;&lt;li&gt;สร้าง Agent โดยไม่กำหนดผลลัพธ์&lt;/li&gt;&lt;li&gt;เห็น AI เปิดเว็บแล้วเรียกทุกอย่างว่า A2A&lt;/li&gt;&lt;li&gt;เชื่อว่า AI ทำธุรกรรมได้ทุกบริการโดยไม่ต้องเชื่อมต่อ&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div&gt;&lt;h3 style=&quot;color:var(--mint)&quot;&gt;แต่ให้สอนเพิ่มว่า...&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;กำหนดเป้าหมายที่ตรวจสอบผลได้&lt;/li&gt;&lt;li&gt;เลือกใช้เครื่องมือที่ถูกงาน&lt;/li&gt;&lt;li&gt;แยก Tool Use / Computer Use / A2A&lt;/li&gt;&lt;li&gt;ตั้งสิทธิ์ หลักฐาน และจุดอนุมัติ&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;takeaway&quot;&gt;&lt;b&gt;อนาคตของการใช้ AI ไม่ใช่แค่ถามว่า&lt;br&gt;“AI ตัวนี้ทำอะไรได้?”&lt;br&gt;&lt;span style=&quot;color:var(--mint)&quot;&gt;แต่ถามว่า “AI ตัวนี้ไปทำอะไรให้เราได้จริง?”&lt;/span&gt;&lt;/b&gt;&lt;p&gt;ความสามารถจริงขึ้นกับเครื่องมือที่เชื่อมต่อ สิทธิ์ที่ได้รับ ความพร้อมของบริการ ความน่าเชื่อถือของผลลัพธ์ และมนุษย์ที่กำกับการตัดสินใจ&lt;/p&gt;&lt;/div&gt;
      &lt;h3 style=&quot;margin:40px 0 7px&quot;&gt;เอกสารอ้างอิงหลัก&lt;/h3&gt;&lt;p class=&quot;fine&quot;&gt;มาตรฐานและผลิตภัณฑ์เปลี่ยนแปลงต่อเนื่อง ตัวอย่างในบทเรียนเป็นแบบจำลองเชิงแนวคิด ไม่ใช่การเชื่อมต่อร้านค้าหรือ Agent ภายนอกจริง&lt;/p&gt;

    &lt;/div&gt;

&lt;script&gt;
(()=&gt;{
  &#39;use strict&#39;;
  const paths={
    tool:{title:&#39;เส้นทาง: เรียกเครื่องมือผ่าน API / MCP&#39;,desc:&#39;AI ใช้ความสามารถของบริการอื่นโดยตรง เช่น อ่านข้อมูลในระบบหรือสร้างร่างเอกสาร โดยไม่จำเป็นต้องมี Agent อีกตัว&#39;,steps:[&#39;ตรวจว่ามีสิทธิ์ใช้เครื่องมือ&#39;,&#39;เรียกฟังก์ชันด้วยข้อมูลที่ถูกต้อง&#39;,&#39;อ่านผลลัพธ์และตรวจความถูกต้อง&#39;]},
    gui:{title:&#39;เส้นทาง: ควบคุมเว็บไซต์หรือโปรแกรม&#39;,desc:&#39;AI มองเห็นหน้าจอแล้วใช้เมาส์ คีย์บอร์ด หรือเบราว์เซอร์เพื่อทำงานแบบที่คนทำ ไม่ใช่ A2A เพียงเพราะ AI เปิดเว็บได้&#39;,steps:[&#39;เข้าหน้าเว็บที่ได้รับอนุญาต&#39;,&#39;คลิก พิมพ์ เลือก และอ่านสถานะ&#39;,&#39;ขอให้คนช่วยหรืออนุมัติเมื่อจำเป็น&#39;]},
    a2a:{title:&#39;เส้นทาง: Agent ติดต่อ Agent ผ่าน A2A&#39;,desc:&#39;Agent หลักส่งคำขอไปยัง Agent อื่นที่รองรับโปรโตคอล เพื่อให้ช่วยทำภารกิจและรายงานสถานะกลับมา&#39;,steps:[&#39;ค้นพบ Agent ที่มีความสามารถที่ต้องการ&#39;,&#39;ส่งงานและแลกเปลี่ยนข้อมูลผ่าน A2A&#39;,&#39;รับผล ตรวจหลักฐาน และขออนุมัติขั้นตอนสำคัญ&#39;]}
  };
  const pathButtons=[...document.querySelectorAll(&#39;[data-path]&#39;)];
  function showPath(key){pathButtons.forEach(b=&gt;b.setAttribute(&#39;aria-pressed&#39;,String(b.dataset.path===key)));document.querySelectorAll(&#39;[data-lane]&#39;).forEach(n=&gt;n.classList.toggle(&#39;on&#39;,n.dataset.lane===key));document.getElementById(&#39;pathTitle&#39;).textContent=paths[key].title;document.getElementById(&#39;pathDesc&#39;).textContent=paths[key].desc;document.getElementById(&#39;pathSteps&#39;).innerHTML=paths[key].steps.map(s=&gt;&#39;&lt;li&gt;&#39;+s+&#39;&lt;/li&gt;&#39;).join(&#39;&#39;);}
  pathButtons.forEach(b=&gt;b.addEventListener(&#39;click&#39;,()=&gt;showPath(b.dataset.path)));
  const cases={
    manual:{badge:&#39;คนลงมือเอง&#39;,steps:[[&#39;เปิดเว็บ&#39;,&#39;ค้นหาร้านค้าเอง&#39;],[&#39;เปรียบเทียบ&#39;,&#39;ไล่ดูราคาและเงื่อนไข&#39;],[&#39;ติดต่อร้าน&#39;,&#39;ถามรายละเอียดเอง&#39;],[&#39;ตัดสินใจ&#39;,&#39;ตรวจแล้วซื้อเอง&#39;]],note:&#39;AI อาจช่วยให้คำแนะนำ แต่คนต้องเปลี่ยนแอป กรอกข้อมูล และทำขั้นตอนต่าง ๆ ด้วยตัวเอง&#39;},
    tools:{badge:&#39;Tool Use / Computer Use&#39;,steps:[[&#39;มอบหมายเป้าหมาย&#39;,&#39;บอกงบและเงื่อนไข&#39;],[&#39;ค้นและอ่าน&#39;,&#39;AI ใช้เครื่องมือหรือเบราว์เซอร์ที่เชื่อมต่อ&#39;],[&#39;เปรียบเทียบ&#39;,&#39;AI สรุปตัวเลือกพร้อมแหล่งที่มา&#39;],[&#39;ขออนุมัติ&#39;,&#39;คนตรวจรายละเอียดก่อนซื้อ&#39;]],note:&#39;ตัวอย่างนี้ใช้ Tool Use / Computer Use แม้ Agent จะเปิดหลายเว็บ ก็ยังไม่ใช่ A2A โดยอัตโนมัติ&#39;},
    a2a:{badge:&#39;แบบจำลอง A2A&#39;,steps:[[&#39;ผู้ช่วยรับงาน&#39;,&#39;เข้าใจเงื่อนไขผู้ซื้อ&#39;],[&#39;ส่งงานให้ Agent ร้านค้า&#39;,&#39;ติดต่อ Agent ที่รองรับ A2A&#39;],[&#39;Agent ร้านค้าตอบกลับ&#39;,&#39;จัดตัวเลือกและข้อมูลการสั่งซื้อ&#39;],[&#39;คนยืนยัน&#39;,&#39;ตรวจราคา ผู้ขาย และเงื่อนไขก่อนตกลง&#39;]],note:&#39;เป็นภาพสถาปัตยกรรมสมมุติเพื่อสอน A2A: ใช้ได้จริงต่อเมื่อฝั่งร้านมี Agent รองรับ มีสิทธิ์เชื่อมต่อ และมีขั้นตอนยืนยันที่ปลอดภัย&#39;}
  };
  function showCase(key){document.querySelectorAll(&#39;[data-case]&#39;).forEach(b=&gt;b.setAttribute(&#39;aria-pressed&#39;,String(b.dataset.case===key)));const obj=cases[key];document.getElementById(&#39;caseBadge&#39;).textContent=obj.badge;document.getElementById(&#39;caseSteps&#39;).innerHTML=obj.steps.map((st,i)=&gt;`&lt;div class=&quot;case-step&quot;&gt;&lt;span class=&quot;num&quot;&gt;STEP 0${i+1}&lt;/span&gt;&lt;strong&gt;${st[0]}&lt;/strong&gt;&lt;p&gt;${st[1]}&lt;/p&gt;&lt;/div&gt;`).join(&#39;&#39;);document.getElementById(&#39;caseNote&#39;).textContent=obj.note;}
  document.querySelectorAll(&#39;[data-case]&#39;).forEach(b=&gt;b.addEventListener(&#39;click&#39;,()=&gt;showCase(b.dataset.case)));
  showCase(&#39;manual&#39;);
  const prompts={
    shop:`เป้าหมาย: ช่วยหาอุปกรณ์ทำงานกับ AI งบไม่เกิน 2,000 บาท 3 ตัวเลือก พร้อมข้อดีข้อเสีย\n\nวิธีทำงาน: ใช้เฉพาะเว็บไซต์หรือเครื่องมือที่คุณเข้าถึงได้จริง ค้นราคาและเงื่อนไขล่าสุด พร้อมแหล่งอ้างอิง\n\nตรวจผล: เปรียบเทียบราคาสุทธิ การรับประกัน ความน่าเชื่อถือของผู้ขาย และวันส่งโดยประมาณ แยกข้อมูลที่ตรวจสอบไม่ได้อย่างชัดเจน\n\nขอบเขต: ห้ามกดชำระเงินหรือส่งคำสั่งซื้อก่อนฉันอนุมัติ และอย่าอ้างว่าร้านมี A2A หากยังไม่ตรวจพบ`,
    content:`เป้าหมาย: จัดทำบทความความรู้ AI สำหรับเว็บไซต์ของฉัน พร้อมโครงแบบ Visual Learning\n\nวิธีทำงาน: ค้นแหล่งข้อมูลต้นทาง ตรวจวันที่และข้อเท็จจริง แล้วร่างเนื้อหา ภาพรวมอินเทอร์แอ็กทีฟ และคำอธิบายสำหรับคนทั่วไป\n\nตรวจผล: แสดงแหล่งอ้างอิง จุดที่ยังไม่ยืนยัน และตรวจการแสดงผลบนมือถือ หากเชื่อม WordPress ได้ให้สร้างเป็นฉบับร่างเท่านั้น\n\nขอบเขต: ห้ามเผยแพร่สาธารณะหรือแก้บทความจริงก่อนฉันอนุมัติ`,
    message:`เป้าหมาย: ช่วยร่างข้อความชวนเพื่อนคุยเรื่องโครงการ AI ในภาษาที่เป็นธรรมชาติ\n\nวิธีทำงาน: เตรียมข้อความสั้น ๆ 2 แบบ จากข้อมูลที่ฉันให้ ตรวจชื่อผู้รับและช่องทางที่จะส่งกับฉันก่อน\n\nตรวจผล: แสดงข้อความฉบับสุดท้ายและชื่อผู้รับให้ฉันตรวจอีกครั้ง\n\nขอบเขต: ห้ามส่งข้อความโดยอัตโนมัติจนกว่าฉันจะยืนยันทั้งผู้รับและเนื้อหา`};
  let currentPrompt=&#39;shop&#39;;
  function showPrompt(key){currentPrompt=key;document.querySelectorAll(&#39;[data-prompt]&#39;).forEach(b=&gt;b.setAttribute(&#39;aria-pressed&#39;,String(b.dataset.prompt===key)));document.getElementById(&#39;promptText&#39;).textContent=prompts[key];document.getElementById(&#39;copyStatus&#39;).textContent=&#39;กดคัดลอกเพื่อนำไปทดลอง&#39;;}

<script id="hm-a2a-embed-controller">
(function(){
  const frame=document.getElementById('hm-a2a-lesson-iframe');if(!frame)return;
  const req=()=>frame.contentWindow?.postMessage({type:'hybridmind.a2a.measure'},'*');
  window.addEventListener('message',e=>{
    if(e.source!==frame.contentWindow || e.data?.type!=='hybridmind.a2a.lesson')return;
    if(e.data.kind==='height'){
      const h=Math.round(Number(e.data.height));
      if(Number.isFinite(h)&&h>=500&&h<=50000)frame.style.height=h+'px';
    }
    if(e.data.kind==='scroll'){
      const top=Number(e.data.top);
      if(Number.isFinite(top)&&top>=0&&top<=50000)window.scrollTo({top:frame.getBoundingClientRect().top+window.scrollY+top-14,behavior:'smooth'});
    }
  });
  frame.addEventListener('load',req);
})();
</script>
